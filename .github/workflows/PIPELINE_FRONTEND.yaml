name: pipe_front

on:
  push:
    paths:
      - "frontend/**"
      - ".github/workflows/PIPELINE_FRONTEND.yaml"

  pull_request:
    branches:
      - main
    paths:
      - "frontend/**"
      - ".github/workflows/PIPELINE_FRONTEND.yaml"

jobs:
  build:
    name: build_front
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Verificar tipos
        run: npm run typecheck

      - name: Verificar lint
        run: npm run lint

      - name: Verificar formatação
        run: npm run format:check

      - name: Compilar aplicação
        run: npm run build

    
  test:
    name: teste_front
    runs-on: ubuntu-latest
    needs: build

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Criar diretório de relatórios
        run: mkdir -p test-results

      - name: Executar testes
        run: npm run test:ci

      - name: Publicar relatório de testes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-testes-frontend
          path: frontend/test-results/junit.xml
          if-no-files-found: warn
          retention-days: 14
