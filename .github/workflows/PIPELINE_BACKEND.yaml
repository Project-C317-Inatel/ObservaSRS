
name: pipe_back

on:
  push:

  pull_request:
    branches:
      - main
    paths:
      - "backend/**"
      - ".github/workflows/PIPELINE_BACKEND.yaml"

jobs:
  build:
    name: build_back
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/observasrs?schema=public

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Verificar tipos
        run: npm run typecheck

      - name: Compilar aplicação
        run: npm run build

  test:
    name: teste_back
    runs-on: ubuntu-latest
    needs: build

    defaults:
      run:
        working-directory: backend

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/observasrs?schema=public

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Executar testes
        run: npm test -- --reporter=default --reporter=junit --outputFile=test-results/junit.xml

      - name: Publicar relatório de testes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-testes-backend
          path: backend/test-results/junit.xml
          if-no-files-found: warn
          retention-days: 14
